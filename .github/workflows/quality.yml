name: 品質ゲート
on:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cocolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cocolo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: pnpmを準備
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.26.0
      - name: Node.js環境を準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定インストール
        run: pnpm install --frozen-lockfile
      - name: 静的品質検査
        run: pnpm verify:pnpm-config && pnpm lint:workflows && pnpm verify:migration-sql && pnpm lint:biome && pnpm verify:workspace-boundaries
      - name: テストDBのRLS用ロールを準備
        run: pnpm db:prepare:test
        env:
          DATABASE_URL: postgresql://cocolo_app:cocolo_app@localhost:5432/cocolo_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cocolo_test
          LINE_DELIVERY_WORKER_DATABASE_URL: postgresql://line_delivery_worker:line_delivery_worker@localhost:5432/cocolo_test
      - name: テストDBへマイグレーションとテストデータを投入
        run: pnpm --filter @cocolo/db exec prisma migrate deploy && pnpm db:seed:test
        env:
          DATABASE_URL: postgresql://cocolo_app:cocolo_app@localhost:5432/cocolo_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cocolo_test
          LINE_DELIVERY_WORKER_DATABASE_URL: postgresql://line_delivery_worker:line_delivery_worker@localhost:5432/cocolo_test
      - name: 契約検証とテスト
        run: pnpm generate:openapi && git diff --exit-code -- packages/contracts/openapi.yaml && pnpm test:unit && pnpm test:integration
        env:
          DATABASE_URL: postgresql://cocolo_app:cocolo_app@localhost:5432/cocolo_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cocolo_test
          LINE_DELIVERY_WORKER_DATABASE_URL: postgresql://line_delivery_worker:line_delivery_worker@localhost:5432/cocolo_test
      - name: 型検査とビルド
        run: pnpm typecheck && pnpm build
      - name: release artifactのruntime依存を検証
        run: |
          pnpm test:release
          pnpm package:release --artifact-sha "$GITHUB_SHA" --output .release-ci
          pnpm verify:release --artifact-sha "$GITHUB_SHA" --release-dir .release-ci
