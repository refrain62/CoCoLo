name: 品質ゲート
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cocolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cocolo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: pnpmを準備
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.26.0
      - name: Node.js環境を準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: 依存関係を固定インストール
        run: pnpm install --frozen-lockfile
      - name: 静的品質検査
        run: pnpm verify:pnpm-config && pnpm lint:workflows && pnpm test:workflows && pnpm verify:migration-sql && pnpm lint:biome && pnpm verify:workspace-boundaries && pnpm audit --prod --audit-level high && pnpm audit --audit-level moderate && pnpm security:verify && pnpm test:security
      - name: テストDBのRLS用ロールを準備
        run: pnpm db:prepare:test
        env:
          DATABASE_URL: postgresql://cocolo_app:cocolo_app@localhost:5432/cocolo_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cocolo_test
      - name: テストDBへマイグレーションとテストデータを投入
        run: pnpm --filter @cocolo/db exec prisma migrate deploy && pnpm db:seed:test
        env:
          DATABASE_URL: postgresql://cocolo_app:cocolo_app@localhost:5432/cocolo_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cocolo_test
      - name: 契約検証とテスト
        run: pnpm generate:openapi && git diff --exit-code -- packages/contracts/openapi.yaml && pnpm test:unit && pnpm test:integration
        env:
          DATABASE_URL: postgresql://cocolo_app:cocolo_app@localhost:5432/cocolo_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cocolo_test
      - name: 型検査とビルド
        run: pnpm typecheck && pnpm build
  security:
    name: セキュリティ検査
    uses: ./.github/workflows/security-scanners.yml
    permissions:
      contents: read
  gate:
    name: quality aggregate gate
    if: ${{ always() }}
    needs:
      - quality
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
    steps:
      - name: qualityとsecurityをfail-closedで集約
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ]; then
            echo "quality aggregate gate: FAIL"
            exit 1
          fi
          echo "quality aggregate gate: PASS"
