name: セキュリティ検査

on:
  # PRではbase側に存在するこのWorkflowだけを実行する。headのWorkflowは実行しない。
  pull_request_target:
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  trust:
    name: scanner trust gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TRUST_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || github.sha }}
      TRUST_HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha || github.sha }}
      TRUST_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
      SECURITY_TARGET_ROOT: /tmp/cocolo-security-target
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: base側のtrust checkerを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
      - name: Node.js 24を準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          check-latest: false
      - name: base側checkerでhead対象を取得
        run: |
          set -euo pipefail
          [[ "$TRUST_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUST_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUST_BASE_SHA" != "0000000000000000000000000000000000000000" ]]
          [[ "$TRUST_HEAD_SHA" != "0000000000000000000000000000000000000000" ]]
          node scripts/prepare-security-target.ts
          node scripts/verify-security-trust.ts

  config:
    name: scanner設定
    needs: trust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TRUST_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || github.sha }}
      TRUST_HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha || github.sha }}
      TRUST_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
      SECURITY_TARGET_ROOT: /tmp/cocolo-security-target
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
      - name: pnpmを準備
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.0.0
        with:
          version: 10.26.0
      - name: Node.js 24を準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          check-latest: false
      - name: base側checkerでhead対象を準備
        run: node scripts/prepare-security-target.ts
      - name: 依存関係を固定インストール
        run: pnpm install --frozen-lockfile
      - name: scanner設定を静的検証
        run: pnpm security:verify
      - name: WorkflowのAction SHAを検証
        run: pnpm lint:workflows
      - name: scanner悪性fixtureを検証
        run: pnpm test:security

  scanners:
    name: Gitleaks / Semgrep / Trivy
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TRUST_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || github.sha }}
      TRUST_HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha || github.sha }}
      TRUST_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
      SECURITY_TARGET_ROOT: /tmp/cocolo-security-target
      GITHUB_TOKEN: ${{ github.token }}
      SECURITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
      - name: pnpmを準備
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.0.0
        with:
          version: 10.26.0
      - name: Node.js 24を準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          check-latest: false
      - name: base側checkerでhead対象を準備
        run: node scripts/prepare-security-target.ts
      - name: 固定digest scannerでhead directoryを実行
        run: pnpm security:scan

  gate:
    name: security gate
    if: ${{ always() }}
    needs:
      - trust
      - config
      - scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      CONFIG_RESULT: ${{ needs.config.result }}
      SCANNERS_RESULT: ${{ needs.scanners.result }}
      TRUST_RESULT: ${{ needs.trust.result }}
      SECURITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: scanner結果をfail-closedで集約
        run: |
          if [ "$TRUST_RESULT" != "success" ] || [ "$CONFIG_RESULT" != "success" ] || [ "$SCANNERS_RESULT" != "success" ]; then
            line="tool=security-gate critical=0 high=0 medium=0 low=0 unknown=1 verdict=FAIL run_url=$SECURITY_RUN_URL"
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          line="tool=security-gate critical=0 high=0 medium=0 low=0 unknown=0 verdict=PASS run_url=$SECURITY_RUN_URL"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
