name: セキュリティ検査

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    name: scanner設定
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: pnpmを準備
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.0.0
        with:
          version: 10.26.0
      - name: Node.js 24を準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          check-latest: false
      - name: scanner設定を静的検証
        run: pnpm security:verify
      - name: WorkflowのAction SHAを検証
        run: pnpm lint:workflows

  scanners:
    name: Gitleaks / Semgrep / Trivy
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SECURITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: pnpmを準備
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.0.0
        with:
          version: 10.26.0
      - name: Node.js 24を準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0
          check-latest: false
      - name: 固定digest scannerを実行
        run: pnpm security:scan

  gate:
    name: security gate
    if: ${{ always() }}
    needs:
      - config
      - scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      CONFIG_RESULT: ${{ needs.config.result }}
      SCANNERS_RESULT: ${{ needs.scanners.result }}
      SECURITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: scanner結果をfail-closedで集約
        run: |
          if [ "$CONFIG_RESULT" != "success" ] || [ "$SCANNERS_RESULT" != "success" ]; then
            line="tool=security-gate critical=0 high=0 medium=0 low=0 unknown=1 verdict=FAIL run_url=$SECURITY_RUN_URL"
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          line="tool=security-gate critical=0 high=0 medium=0 low=0 unknown=0 verdict=PASS run_url=$SECURITY_RUN_URL"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
