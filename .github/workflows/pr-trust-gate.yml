name: PR信頼境界ゲート
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  trusted-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: baseブランチの正本を取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js環境を準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: baseの信頼済みPR検査を実行
        run: node scripts/verify-trusted-pr.ts
        env:
          GH_TOKEN: ${{ github.token }}
