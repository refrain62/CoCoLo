name: 手動ローカルE2E

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 40桁の検証対象commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: 入力SHAを厳密検証
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: 解決用のWorkflowを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 対象SHAを検証
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          target_sha="${TARGET_SHA_INPUT:-}"
          if ! [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '対象SHAは小文字40桁のcommit SHAで指定してください。' >&2
            exit 1
          fi
          resolved_sha="$(gh api "repos/$REPOSITORY/commits/$target_sha" --jq '.sha')"
          if [[ "$resolved_sha" != "$target_sha" ]]; then
            echo '対象SHAをリポジトリのcommitとして検証できません。' >&2
            exit 1
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

  e2e:
    name: Chromium E2E
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 検証済みSHAを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: pnpmを準備
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.26.0
      - name: Node.js 24を準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係を固定インストール
        run: pnpm install --frozen-lockfile
      - name: Chromiumを準備
        run: pnpm exec playwright install --with-deps chromium
      - name: Auth fixtureと合成値をログから秘匿
        run: |
          printf '::add-mask::%s\n' "$E2E_TEST_EMAIL"
          printf '::add-mask::%s\n' "$E2E_TEST_PASSWORD"
          printf '::add-mask::%s\n' "$E2E_REPORT_CANARY"
        env:
          E2E_TEST_EMAIL: owner-a@example.test
          E2E_TEST_PASSWORD: owner-password
          E2E_REPORT_CANARY: t014-e2e-canary-must-not-appear
      - name: 手動指定SHAのE2Eを実行
        run: pnpm test:e2e:periodic
        env:
          APP_ENV: local
          E2E_ENV: local
          E2E_MODE: manual
          E2E_ITERATION: '1'
          E2E_TOTAL_ITERATIONS: '1'
          E2E_TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          E2E_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_REPORT_PATH: e2e-report/fixed-report.json
          E2E_REPORT_CANARY: t014-e2e-canary-must-not-appear
          E2E_SEED: t014-manual-seed-v1
          E2E_TEST_EMAIL: owner-a@example.test
          E2E_TEST_PASSWORD: owner-password
          TZ: UTC
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
      - name: 固定レポートを秘匿検査
        if: always()
        run: node scripts/verify-e2e-report.ts --path "$E2E_REPORT_PATH"
        env:
          E2E_REPORT_PATH: e2e-report/fixed-report.json
          E2E_REPORT_CANARY: t014-e2e-canary-must-not-appear
          E2E_TEST_EMAIL: owner-a@example.test
          E2E_TEST_PASSWORD: owner-password
      - name: 固定レポートだけを保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-fixed-report-manual-${{ github.run_id }}
          path: e2e-report/fixed-report.json
          if-no-files-found: error
          retention-days: 3

  issue:
    name: E2E失敗Issueを同期
    needs: e2e
    if: ${{ always() && (needs.e2e.result == 'failure' || needs.e2e.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: 固定レポートを取得
        if: needs.e2e.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: e2e-fixed-report-manual-*
          merge-multiple: true
          path: e2e-report
      - name: 失敗Issueまたは回復状態を同期
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_RESULT: ${{ needs.e2e.result }}
          MODE: manual
          REPORT_CANARY: t014-e2e-canary-must-not-appear
        run: |
          set -euo pipefail
          issue_title="定期E2E失敗 [$MODE]"
          issue_number="$(gh issue list --repo "$REPOSITORY" --state open --limit 100 --json number,title | jq -r --arg title "$issue_title" '.[] | select(.title == $title) | .number' | sed -n '1p')"

          if [[ "$E2E_RESULT" == 'success' ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue close "$issue_number" --repo "$REPOSITORY" --reason completed
            fi
            exit 0
          fi

          shopt -s nullglob
          reports=(e2e-report/*.json)
          failed_rows=''
          expected_target=''
          for report in "${reports[@]}"; do
            if grep -Eiq "@|[0-9]{2,4}[-.][0-9]{2,4}[-.][0-9]{3,4}|password|secret|token|authorization|cookie|storage|http[ _-]?body|database_url|direct_url" "$report" || grep -Fq "$REPORT_CANARY" "$report"; then
              echo '固定レポートに秘匿対象が含まれています。' >&2
              exit 1
            fi
            report_target="$(jq -er '.targetSha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$report")"
            if [[ -z "$expected_target" ]]; then
              expected_target="$report_target"
            elif [[ "$expected_target" != "$report_target" ]]; then
              echo '手動E2Eの対象SHAが一致しません。' >&2
              exit 1
            fi
            jq -e --arg mode "$MODE" --arg run_url "$RUN_URL" --arg target_sha "$report_target" '
              type == "object" and
              .version == 1 and
              .mode == $mode and
              .targetSha == $target_sha and
              .runUrl == $run_url and
              (.iteration | type == "number" and . >= 1) and
              (.totalIterations | type == "number" and . == 1) and
              (.iteration <= .totalIterations) and
              (.tests | type == "array" and all(.[]; (.testName | type == "string" and test("^[a-z0-9][a-z0-9-]{0,63}$")) and (.status == "success" or .status == "failure")))
            ' "$report" >/dev/null
            rows="$(jq -r --arg run_url "$RUN_URL" '.tests[] | select(.status == "failure") | "\(.testName) | failure | \($run_url)"' "$report")"
            if [[ -n "$rows" ]]; then
              failed_rows+="$rows"
              failed_rows+=$'\n'
            fi
          done
          if [[ -z "$failed_rows" ]]; then
            failed_rows="workflow | failure | $RUN_URL"
          fi
          failed_rows="$(printf '%s' "$failed_rows" | sort -u)"
          body="$(printf 'テスト名 | 判定 | run URL\n---|---|---\n%s\n' "$failed_rows")"
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --repo "$REPOSITORY" --title "$issue_title" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$issue_title" --body "$body"
          fi
