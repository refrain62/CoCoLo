name: production deploy（Free期間は無効）
on:
  workflow_dispatch:
    inputs:
      artifact_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deployment-disabled:
    # GitHub Free期間はflag、dispatch、secretのいずれでもdeployへ到達させない。
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
