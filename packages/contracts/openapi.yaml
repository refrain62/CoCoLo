{
  "openapi": "3.1.0",
  "info": {
    "title": "CoCoLo API",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/uploads": {
      "post": {
        "operationId": "createUploadSession",
        "summary": "添付アップロードセッションを作成",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UploadSessionInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "署名URLを発行",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UploadSessionResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/uploads/{id}/complete": {
      "post": {
        "operationId": "completeUpload",
        "summary": "添付アップロードを完了",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UploadCompleteInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "検証済み添付"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "409": {
            "description": "セッション再利用またはrequest競合"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "UploadSessionInput": {
        "type": "object",
        "required": [
          "mediaType",
          "byteSize",
          "ownerUserId"
        ],
        "additionalProperties": false,
        "properties": {
          "mediaType": {
            "type": "string",
            "enum": [
              "image/jpeg",
              "image/png",
              "application/pdf"
            ]
          },
          "byteSize": {
            "type": "integer",
            "minimum": 1,
            "maximum": 20971520
          },
          "ownerUserId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      },
      "UploadSessionResponse": {
        "type": "object",
        "required": [
          "attachmentId",
          "uploadUrl",
          "expiresAt",
          "maxBytes",
          "mediaType"
        ],
        "additionalProperties": false,
        "properties": {
          "attachmentId": {
            "type": "string",
            "format": "uuid"
          },
          "uploadUrl": {
            "type": "string",
            "format": "uri"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "maxBytes": {
            "type": "integer",
            "const": 20971520
          },
          "mediaType": {
            "type": "string",
            "enum": [
              "image/jpeg",
              "image/png",
              "application/pdf"
            ]
          }
        }
      },
      "UploadCompleteInput": {
        "type": "object",
        "required": [
          "sha256",
          "byteSize"
        ],
        "additionalProperties": false,
        "properties": {
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "byteSize": {
            "type": "integer",
            "minimum": 1,
            "maximum": 20971520
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object"
          }
        }
      }
    },
    "responses": {
      "BadRequest": {
        "description": "入力不正",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "未認証",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  },
  "x-cocolo-upload-session-ttl-seconds": 900
}
